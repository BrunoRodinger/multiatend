<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08080F">
<title>Falta só um passo | MultiAtend</title>
<meta name="description" content="Deixe seu contato para receber o material do post e o retorno da MultiAtend no WhatsApp.">
<link rel="icon" href="/Disigner/LOGO/svg/multiatend_icone_gradiente-preto.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/Disigner/LOGO/png/multiatend_icone_gradiente-preto.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/*
  MARCA — mesmos tokens do index.html e do blog.
  Se a identidade do site mudar, atualize este bloco junto.
*/
:root {
  --purple: #7C3AED;
  --purple-light: #A78BFA;
  --blue: #3B82F6;
  --gradient: linear-gradient(135deg, #3B82F6 0%, #7C3AED 100%);
  --gradient-text: linear-gradient(135deg, #60A5FA, #A78BFA);
  --bg: #08080F;
  --bg-card: #111120;
  --text-1: #FFFFFF;
  --text-2: #CBD5E1;
  --text-muted: #94A3B8;
  --text-3: #64748B;
  --border: rgba(124, 58, 237, 0.15);
  --border-campo: rgba(124, 58, 237, 0.3);
  --foco: rgba(124, 58, 237, 0.3);
  --green: #10B981;
  --red: #EF4444;
  --red-light: #F87171;
  --radius: 12px;
  --radius-lg: 20px;
  --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(124, 58, 237, 0.1);
  --fonte: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --largura: 480px;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { color-scheme: dark; background: var(--bg); }
body {
  margin: 0;
  min-height: 100dvh;
  font-family: var(--fonte);
  color: var(--text-2);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(520px 340px at 50% -140px, rgba(124, 58, 237, 0.38), transparent 70%),
    radial-gradient(380px 300px at -120px 300px, rgba(59, 130, 246, 0.2), transparent 70%),
    radial-gradient(340px 300px at calc(100% + 120px) 620px, rgba(124, 58, 237, 0.16), transparent 70%),
    var(--bg);
  background-repeat: no-repeat;
}
.pagina {
  width: 100%;
  max-width: var(--largura);
  margin: 0 auto;
  padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
}

/* Logo e chamada */
.topo {
  display: flex;
  justify-content: center;
  margin: 0 0 28px;
  transition: margin .4s ease;
}
.logo { display: block; height: 26px; width: auto; }
.intro { text-align: center; padding: 0 4px; }
.recolhe {
  overflow: hidden;
  max-height: 8rem;
  opacity: 1;
  transition: max-height .4s ease, opacity .28s ease, margin .4s ease;
}
.tag-linha { margin: 0 0 16px; }
.tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 100px;
  background: rgba(124, 58, 237, 0.08);
  color: var(--purple-light);
  font-size: 13px;
  font-weight: 500;
}
.tag-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--purple-light);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(1.4); } }
h1 {
  margin: 0 0 12px;
  color: var(--text-1);
  font-size: clamp(1.9rem, 8.5vw, 2.5rem);
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -0.03em;
}
h1:focus { outline: none; }
.grad-text {
  background: var(--gradient-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.apoio {
  max-width: 360px;
  margin: 0 auto 24px;
  color: var(--text-2);
  font-size: 1rem;
}
.pagina.foco .recolhe { max-height: 0; opacity: 0; margin-bottom: 0; }
.pagina.foco .topo { margin-bottom: 16px; }

/* Card */
.cartao {
  position: relative;
  overflow: hidden;
  padding: 24px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}
.cartao::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: var(--gradient);
}

/* Formulário */
form { display: flex; flex-direction: column; gap: 16px; }
.campo { display: flex; flex-direction: column; gap: 6px; }
label { color: var(--text-1); font-size: 0.875rem; font-weight: 600; }
input[type="text"],
input[type="email"],
input[type="tel"] {
  width: 100%;
  min-height: 50px;
  padding: 13px 14px;
  border: 1px solid var(--border-campo);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text-1);
  font: 16px/1.4 var(--fonte);
  appearance: none;
  transition: border-color .15s, box-shadow .15s;
}
input::placeholder { color: var(--text-3); }
input:focus {
  outline: none;
  border-color: var(--purple);
  box-shadow: 0 0 0 4px var(--foco);
}
input:-webkit-autofill,
input:-webkit-autofill:hover {
  -webkit-text-fill-color: var(--text-1);
  -webkit-box-shadow: 0 0 0 1000px var(--bg) inset;
  caret-color: var(--text-1);
}
input:-webkit-autofill:focus {
  -webkit-text-fill-color: var(--text-1);
  -webkit-box-shadow: 0 0 0 1000px var(--bg) inset, 0 0 0 4px var(--foco);
}
input[type="text"][aria-invalid="true"],
input[type="email"][aria-invalid="true"],
input[type="tel"][aria-invalid="true"] {
  border-color: var(--red);
  background: rgba(239, 68, 68, 0.08);
}
.opcional { color: var(--text-muted); font-weight: 500; }
.opcionais-botao {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 44px;
  padding: 4px 0;
  border: 0;
  background: transparent;
  color: var(--text-2);
  font: 500 15px/1.3 var(--fonte);
  text-align: left;
  cursor: pointer;
  transition: color .2s;
}
.opcionais-botao:hover { color: var(--purple-light); }
.opcionais-botao:focus-visible {
  outline: none;
  box-shadow: 0 0 0 4px var(--foco);
  border-radius: 8px;
}
.opcionais-sinal {
  width: 9px;
  height: 9px;
  margin-right: 6px;
  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: rotate(45deg);
  transition: transform .3s ease;
  flex: none;
}
.opcionais.aberto .opcionais-sinal { transform: rotate(-135deg); margin-top: 4px; }
.opcionais-painel {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .35s ease;
}
.opcionais.aberto .opcionais-painel { grid-template-rows: 1fr; }
.opcionais-miolo {
  overflow: hidden;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.opcionais.aberto .opcionais-miolo { padding: 12px 4px 4px; margin: 0 -4px; }
.consentimentos {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.check { display: flex; gap: 12px; align-items: flex-start; }
.check input {
  width: 22px;
  height: 22px;
  margin: 1px 0 0;
  accent-color: var(--purple);
  flex: none;
}
.check input:focus-visible {
  outline: 2px solid var(--purple-light);
  outline-offset: 2px;
}
.check label {
  color: var(--text-muted);
  font-size: 0.875rem;
  font-weight: 400;
  line-height: 1.5;
}
.check a {
  color: var(--purple-light);
  font-weight: 600;
  text-underline-offset: 2px;
}
.erro, .erro-geral {
  margin: 0;
  color: var(--red-light);
  font-size: 0.8125rem;
}
.erro-geral {
  padding: 10px 12px;
  border: 1px solid rgba(239, 68, 68, 0.3);
  border-radius: var(--radius);
  background: rgba(239, 68, 68, 0.1);
  color: #FCA5A5;
}

/* Botão — mesmo .btn-primary do site */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 54px;
  margin-top: 4px;
  padding: 16px 28px;
  border: 0;
  border-radius: var(--radius);
  background: var(--gradient);
  color: #fff;
  font: 600 16px/1 var(--fonte);
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
  transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
}
.btn::after { content: "→"; font-weight: 500; }
.btn[aria-busy="true"]::after { content: none; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(124, 58, 237, 0.55); }
.btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 4px var(--foco), 0 4px 20px rgba(124, 58, 237, 0.4);
}
.btn:disabled { opacity: 0.7; cursor: progress; transform: none; }
.garantia {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin: 0;
  color: var(--text-muted);
  font-size: 13px;
}
.garantia svg { flex: none; color: var(--green); }

/* Obrigado */
#obrigado { padding-top: 4vh; }
#obrigado .cartao { padding: 32px 20px; text-align: center; }
.sucesso {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 56px;
  margin: 0 auto 20px;
  border: 1px solid rgba(16, 185, 129, 0.3);
  border-radius: 50%;
  background: rgba(16, 185, 129, 0.12);
  color: var(--green);
}
.sub { margin: 0; color: var(--text-2); font-size: 1rem; }
.material-nome {
  margin: 16px 0 0;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: rgba(124, 58, 237, 0.08);
  color: var(--text-1);
  font-size: 1.0625rem;
  font-weight: 700;
  line-height: 1.35;
}
.acoes { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
.acoes .btn { margin-top: 0; }
.btn-secundario {
  min-height: 52px;
  padding: 14px 18px;
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: none;
  color: var(--text-1);
  font-size: 15px;
  line-height: 1.3;
  text-align: center;
}
.btn-secundario::after { content: none; }
.btn-secundario:hover {
  border-color: var(--purple-light);
  color: var(--purple-light);
  background: rgba(124, 58, 237, 0.06);
  box-shadow: none;
}

.rodape {
  margin: 28px 0 0;
  color: var(--text-3);
  font-size: 12px;
  text-align: center;
}
.rodape a { color: var(--text-muted); text-underline-offset: 2px; }
.aviso {
  margin: 14px 16px 0;
  color: var(--text-muted);
  font-size: 0.75rem;
  text-align: center;
}
.isca {
  position: absolute;
  left: -10000px;
  width: 1px;
  height: 1px;
  overflow: hidden;
}
@media (prefers-reduced-motion: reduce) {
  .recolhe, .topo, .opcionais-painel, .opcionais-sinal, .btn { transition: none; }
  .tag-dot { animation: none; }
  .btn:hover { transform: none; }
}
@media (min-width: 640px) {
  .pagina { padding: 56px 24px 40px; }
  .topo { margin-bottom: 36px; }
  .logo { height: 30px; }
  .cartao { padding: 32px; }
  #obrigado .cartao { padding: 40px 32px; }
}
</style>
</head>
<body>
<!--
  TEXTOS: edite o título, o texto de apoio, o botão e a tela de entrega direto aqui.
  MATERIAL ENTREGUE: tabela em /lp-captura/materiais.js (um ref por linha).
-->

<main class="pagina">
  <header class="topo">
    <img class="logo" src="/Disigner/LOGO/png/multiatend_horizontal_gradiente-preto.png" alt="MultiAtend" width="1004" height="161">
  </header>

  <div id="formulario">
    <div class="intro">
      <div class="tag-linha recolhe">
        <span class="tag"><span class="tag-dot" aria-hidden="true"></span>Material do post</span>
      </div>
      <h1>Falta só <span class="grad-text">um passo</span></h1>
      <p class="apoio recolhe">Deixe seu contato para receber o material do post. A gente retorna pelo WhatsApp.</p>
    </div>

    <div class="cartao">
      <form id="form-lead" action="/api/lead" method="post" novalidate data-endpoint="/api/lead">
        <div class="campo">
          <label for="nome">Nome e sobrenome</label>
          <input id="nome" name="nome" type="text" autocomplete="name" required maxlength="120" placeholder="Maria Silva" enterkeyhint="next">
          <p class="erro" id="erro-nome" hidden></p>
        </div>
        <div class="campo">
          <label for="whatsapp">WhatsApp</label>
          <input id="whatsapp" name="whatsapp" type="tel" autocomplete="tel" inputmode="tel" required maxlength="16" placeholder="(81) 99999-9999" enterkeyhint="next">
          <p class="erro" id="erro-whatsapp" hidden></p>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="254" spellcheck="false" placeholder="maria@gmail.com" enterkeyhint="next">
          <p class="erro" id="erro-email" hidden></p>
        </div>

        <div class="opcionais" id="opcionais">
          <button type="button" class="opcionais-botao" id="opcionais-botao" aria-expanded="false" aria-controls="opcionais-painel">
            <span>Cargo e empresa <span class="opcional">(opcional)</span></span>
            <span class="opcionais-sinal" aria-hidden="true"></span>
          </button>
          <div class="opcionais-painel" id="opcionais-painel" aria-hidden="true">
            <div class="opcionais-miolo">
              <div class="campo">
                <label for="cargo">Cargo <span class="opcional">(opcional)</span></label>
                <input id="cargo" name="cargo" type="text" autocomplete="organization-title" maxlength="80" placeholder="Gerente comercial" tabindex="-1">
              </div>
              <div class="campo">
                <label for="empresa">Empresa <span class="opcional">(opcional)</span></label>
                <input id="empresa" name="empresa" type="text" autocomplete="organization" maxlength="160" placeholder="Se tiver" tabindex="-1">
              </div>
            </div>
          </div>
        </div>

        <div class="consentimentos">
          <div class="check">
            <input id="aceite_termos" name="aceite_termos" type="checkbox" value="1" aria-describedby="erro-aceite_termos">
            <div>
              <label for="aceite_termos">Li e aceito os <a href="/lp-captura/privacidade" target="_blank" rel="noopener noreferrer">termos e a política de privacidade</a>.</label>
              <p class="erro" id="erro-aceite_termos" hidden></p>
            </div>
          </div>
          <div class="check">
            <input id="aceite_comunicacoes" name="aceite_comunicacoes" type="checkbox" value="1">
            <label for="aceite_comunicacoes">Quero receber informações e comunicações da MultiAtend por WhatsApp e e-mail.</label>
          </div>
        </div>

        <input type="hidden" name="ref" id="ref">
        <input type="hidden" name="utm_source" id="utm_source">
        <input type="hidden" name="utm_medium" id="utm_medium">
        <input type="hidden" name="utm_campaign" id="utm_campaign">
        <input type="hidden" name="utm_term" id="utm_term">
        <input type="hidden" name="utm_content" id="utm_content">
        <input type="hidden" name="page_url" id="page_url">
        <input type="hidden" name="referrer" id="referrer">
        <input type="hidden" name="timestamp" id="timestamp">

        <div class="isca" aria-hidden="true">
          <label for="hp_field">Não preencha</label>
          <input id="hp_field" name="hp_field" type="text" tabindex="-1" autocomplete="off">
        </div>

        <p class="erro-geral" id="erro-geral" hidden role="alert"></p>
        <button class="btn" id="enviar" type="submit">Quero o material</button>
        <p class="garantia">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          Não vendemos seus dados.
        </p>
      </form>
    </div>
  </div>

  <div id="obrigado" hidden>
    <div class="cartao">
      <div class="sucesso" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <h1 tabindex="-1" id="entrega-titulo">Prontinho!</h1>
      <p class="sub">Seu material está aqui:</p>
      <p class="material-nome" id="material-nome" hidden></p>
      <div class="acoes">
        <a class="btn" id="baixar-link" hidden target="_blank" rel="noopener" download>Baixar o guia</a>
        <a class="btn btn-secundario" id="whatsapp-link" hidden target="_blank" rel="noopener noreferrer">Quer ajuda para aplicar? Fala comigo no WhatsApp</a>
      </div>
    </div>
  </div>

  <footer class="rodape">
    © 2026 MultiAtend · <a href="/lp-captura/privacidade" target="_blank" rel="noopener noreferrer">Política de privacidade</a>
  </footer>
</main>

<noscript>
  <p class="aviso">Ative o JavaScript do navegador para enviar o formulário.</p>
</noscript>

<script src="/lp-captura/materiais.js"></script>
<script>
(function () {
  var CHAVES = ["ref", "utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content"];
  var STORAGE_KEY = "multiatend_captura";
  var DDDS = {
    "11": 1, "12": 1, "13": 1, "14": 1, "15": 1, "16": 1, "17": 1, "18": 1, "19": 1,
    "21": 1, "22": 1, "24": 1, "27": 1, "28": 1,
    "31": 1, "32": 1, "33": 1, "34": 1, "35": 1, "37": 1, "38": 1,
    "41": 1, "42": 1, "43": 1, "44": 1, "45": 1, "46": 1, "47": 1, "48": 1, "49": 1,
    "51": 1, "53": 1, "54": 1, "55": 1,
    "61": 1, "62": 1, "63": 1, "64": 1, "65": 1, "66": 1, "67": 1, "68": 1, "69": 1,
    "71": 1, "73": 1, "74": 1, "75": 1, "77": 1, "79": 1,
    "81": 1, "82": 1, "83": 1, "84": 1, "85": 1, "86": 1, "87": 1, "88": 1, "89": 1,
    "91": 1, "92": 1, "93": 1, "94": 1, "95": 1, "96": 1, "97": 1, "98": 1, "99": 1
  };

  var form = document.getElementById("form-lead");
  var botao = document.getElementById("enviar");
  var erroGeral = document.getElementById("erro-geral");
  var blocoForm = document.getElementById("formulario");
  var blocoObrigado = document.getElementById("obrigado");
  var whatsapp = document.getElementById("whatsapp");
  var textoBotao = botao.textContent;

  function rastreioVazio() {
    return {
      ref: "",
      utm_source: "",
      utm_medium: "",
      utm_campaign: "",
      utm_term: "",
      utm_content: "",
      page_url: "",
      referrer: ""
    };
  }

  function lerGuardado() {
    try {
      var bruto = sessionStorage.getItem(STORAGE_KEY);
      if (!bruto) return null;
      var salvo = JSON.parse(bruto);
      var base = rastreioVazio();
      Object.keys(base).forEach(function (chave) {
        if (typeof salvo[chave] === "string") base[chave] = salvo[chave];
      });
      return base;
    } catch (erro) {
      return null;
    }
  }

  function guardar(rastreio) {
    try {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(rastreio));
    } catch (erro) {}
  }

  function resolverRastreio() {
    var params = new URLSearchParams(window.location.search);
    var veioNaUrl = false;
    var daUrl = rastreioVazio();
    CHAVES.forEach(function (chave) {
      var valor = (params.get(chave) || "").trim();
      if (valor) {
        daUrl[chave] = valor.slice(0, 200);
        veioNaUrl = true;
      }
    });

    var rastreio;
    if (veioNaUrl) {
      rastreio = daUrl;
      rastreio.page_url = window.location.href.slice(0, 2000);
      rastreio.referrer = (document.referrer || "").slice(0, 2000);
    } else {
      rastreio = lerGuardado() || rastreioVazio();
      if (!rastreio.page_url) rastreio.page_url = window.location.href.slice(0, 2000);
      if (!rastreio.referrer) rastreio.referrer = (document.referrer || "").slice(0, 2000);
    }
    if (!rastreio.ref) rastreio.ref = "direto";
    guardar(rastreio);
    return rastreio;
  }

  function preencherOcultos(rastreio) {
    CHAVES.concat(["page_url", "referrer"]).forEach(function (chave) {
      var campo = document.getElementById(chave);
      if (campo) campo.value = rastreio[chave] || "";
    });
  }

  function digitosTelefone(valor) {
    var digitos = String(valor || "").replace(/\D/g, "");
    if ((digitos.length === 12 || digitos.length === 13) && digitos.indexOf("55") === 0) {
      digitos = digitos.slice(2);
    }
    return digitos.slice(0, 11);
  }

  function mascararWhatsapp(valor) {
    var d = digitosTelefone(valor);
    if (!d) return "";
    if (d.length <= 2) return "(" + d;
    if (d.length <= 6) return "(" + d.slice(0, 2) + ") " + d.slice(2);
    if (d.length <= 10) return "(" + d.slice(0, 2) + ") " + d.slice(2, 6) + "-" + d.slice(6);
    return "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7);
  }

  function mostrarErro(id, mensagem) {
    var campo = document.getElementById(id);
    var erro = document.getElementById("erro-" + id);
    if (!campo || !erro) return;
    if (mensagem) {
      campo.setAttribute("aria-invalid", "true");
      campo.setAttribute("aria-describedby", erro.id);
      erro.hidden = false;
      erro.textContent = mensagem;
    } else {
      campo.removeAttribute("aria-invalid");
      campo.removeAttribute("aria-describedby");
      erro.hidden = true;
      erro.textContent = "";
    }
  }

  // Nome e sobrenome: duas palavras ou mais, só letras (com acento),
  // espaço, hífen, apóstrofo e ponto. Primeira e última com 2+ letras,
  // então "Maria da Silva" passa e "Maria" ou "Maria S." não.
  function validarNome(nome) {
    if (!nome) return "Informe nome e sobrenome.";
    if (!/^[\p{L}\p{M}' .’-]+$/u.test(nome)) return "Use só letras no nome e sobrenome.";
    var partes = nome.split(" ");
    var letras = function (parte) { return parte.replace(/[^\p{L}]/gu, "").length; };
    if (partes.length < 2 || letras(partes[0]) < 2 || letras(partes[partes.length - 1]) < 2) {
      return "Informe nome e sobrenome.";
    }
    return "";
  }

  function validar() {
    var nome = document.getElementById("nome").value.replace(/\s+/g, " ").trim();
    var email = document.getElementById("email").value.trim();
    var fone = digitosTelefone(whatsapp.value);
    var ok = true;

    var erroNome = validarNome(nome);
    if (erroNome) {
      mostrarErro("nome", erroNome);
      ok = false;
    } else mostrarErro("nome", "");

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
      mostrarErro("email", "Informe um e-mail válido.");
      ok = false;
    } else mostrarErro("email", "");

    var foneOk = (fone.length === 10 || fone.length === 11) && DDDS[fone.slice(0, 2)] && (fone.length !== 11 || fone.charAt(2) === "9");
    if (!foneOk) {
      mostrarErro("whatsapp", "Informe um WhatsApp válido com DDD.");
      ok = false;
    } else mostrarErro("whatsapp", "");

    if (!document.getElementById("aceite_termos").checked) {
      mostrarErro("aceite_termos", "Aceite a política de privacidade para enviar.");
      ok = false;
    } else mostrarErro("aceite_termos", "");

    return ok;
  }

  function textoCampo(id) {
    return document.getElementById(id).value.replace(/\s+/g, " ").trim();
  }

  function montarPayload() {
    document.getElementById("timestamp").value = new Date().toISOString();
    return {
      nome: textoCampo("nome"),
      email: document.getElementById("email").value.trim(),
      whatsapp: whatsapp.value.trim(),
      cargo: textoCampo("cargo"),
      empresa: textoCampo("empresa"),
      aceite_termos: document.getElementById("aceite_termos").checked === true,
      aceite_comunicacoes: document.getElementById("aceite_comunicacoes").checked === true,
      ref: document.getElementById("ref").value,
      utm_source: document.getElementById("utm_source").value,
      utm_medium: document.getElementById("utm_medium").value,
      utm_campaign: document.getElementById("utm_campaign").value,
      utm_term: document.getElementById("utm_term").value,
      utm_content: document.getElementById("utm_content").value,
      page_url: document.getElementById("page_url").value,
      referrer: document.getElementById("referrer").value,
      timestamp: document.getElementById("timestamp").value,
      hp_field: document.getElementById("hp_field").value
    };
  }

  // Material do ref (URL ou sessionStorage); ref desconhecido ou "direto" usa o default.
  function materialDoRef(ref) {
    var tabela = window.MATERIAIS || {};
    var chave = String(ref || "").trim().toLowerCase();
    return tabela[chave] || tabela["default"] || null;
  }

  // Só roda depois de /api/lead responder sucesso: o link do PDF não existe antes disso.
  function mostrarObrigado(primeiroNome) {
    var material = materialDoRef(rastreio.ref);
    document.getElementById("entrega-titulo").textContent = primeiroNome ? "Prontinho, " + primeiroNome + "!" : "Prontinho!";

    var whatsappLink = document.getElementById("whatsapp-link");
    var numero = String(window.WHATSAPP_MATERIAL || "").replace(/\D/g, "");
    if (material) {
      var nomeMaterial = document.getElementById("material-nome");
      nomeMaterial.textContent = material.titulo;
      nomeMaterial.hidden = false;
      var baixar = document.getElementById("baixar-link");
      baixar.href = material.arquivo;
      baixar.hidden = false;
    }
    if (numero) {
      var mensagem = material
        ? "Oi Bruno, baixei o guia " + material.titulo + " e quero conversar."
        : "Oi Bruno, quero conversar.";
      whatsappLink.href = "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensagem);
      whatsappLink.hidden = false;
    }
    blocoForm.hidden = true;
    blocoObrigado.hidden = false;
    blocoObrigado.querySelector("h1").focus();
  }

  var rastreio = resolverRastreio();
  preencherOcultos(rastreio);

  whatsapp.addEventListener("input", function () {
    whatsapp.value = mascararWhatsapp(whatsapp.value);
  });

  function entrarEmFoco() {
    document.querySelector(".pagina").classList.add("foco");
  }

  form.addEventListener("focusin", function (evento) {
    if (evento.target.matches("input")) entrarEmFoco();
  });

  var opcionais = document.getElementById("opcionais");
  var opcionaisBotao = document.getElementById("opcionais-botao");
  var opcionaisPainel = document.getElementById("opcionais-painel");
  opcionaisBotao.addEventListener("click", function () {
    entrarEmFoco();
    var aberto = !opcionais.classList.contains("aberto");
    opcionais.classList.toggle("aberto", aberto);
    opcionaisBotao.setAttribute("aria-expanded", aberto ? "true" : "false");
    opcionaisPainel.setAttribute("aria-hidden", aberto ? "false" : "true");
    var campos = opcionaisPainel.querySelectorAll("input");
    for (var i = 0; i < campos.length; i++) {
      if (aberto) campos[i].removeAttribute("tabindex");
      else campos[i].setAttribute("tabindex", "-1");
    }
    if (aberto) document.getElementById("cargo").focus();
  });

  form.addEventListener("submit", function (evento) {
    evento.preventDefault();
    erroGeral.hidden = true;
    if (!validar()) return;

    var payload = montarPayload();
    botao.disabled = true;
    botao.textContent = "Enviando…";
    botao.setAttribute("aria-busy", "true");

    fetch(form.getAttribute("data-endpoint") || "/api/lead", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (resposta) {
      return resposta.json().catch(function () { return {}; }).then(function (corpo) {
        return { ok: resposta.ok, corpo: corpo };
      });
    }).then(function (resultado) {
      if (!resultado.ok) {
        if (resultado.corpo && resultado.corpo.campos) {
          Object.keys(resultado.corpo.campos).forEach(function (campo) {
            mostrarErro(campo, resultado.corpo.campos[campo]);
          });
        }
        erroGeral.hidden = false;
        erroGeral.textContent = (resultado.corpo && resultado.corpo.error) || "Não foi possível enviar agora. Tente de novo em instantes.";
        botao.disabled = false;
        botao.textContent = textoBotao;
        botao.removeAttribute("aria-busy");
        return;
      }
      mostrarObrigado(payload.nome.split(" ")[0]);
    }).catch(function () {
      erroGeral.hidden = false;
      erroGeral.textContent = "Não foi possível enviar agora. Tente de novo em instantes.";
      botao.disabled = false;
      botao.textContent = textoBotao;
      botao.removeAttribute("aria-busy");
    });
  });
})();
</script>
</body>
</html>
